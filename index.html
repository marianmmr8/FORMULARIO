<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <div class="container">
    <h1>Iniciar Sesión</h1>
    <!-- para el envio de datos se pone post lo vemos mas adelante pero siempre es post, con get se ven los datos en la barra como la contraseña  -->
    <!-- se pone el atributo required para obligar a que se logeen las personas completamente no darle solo a enviar sin campo rellenos  -->
    <form method="get" action="#">
      <div class="campo-formulario">
        <!-- poner en las etiquetas el nombre siempre nombre e id -->
        <label for="nombre">Nombre:</label>
        <input
          type="text"
          name="nombre"
          id="nombre"
          placeholder="Escribe tu nombre" required
        />
      </div>
      <div class="campo-formulario">
        <!-- igual que con el nombre lo hacemos con el email -->
        <label for="email">Email:</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder=" Escribe tu email" required
        />
      </div>
      <div class="campo-formulario">
      <label for="password">Contraseña</label>
      <input
        type="password"
        name="password"
        id="password"
        placeholder=" Escribe tu contraseña" required
      />
       <button type="submit">Enviar</button>
      </div>
    </form>
    </div>
  </body>
</html>
